<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizar Foto - #TIMEKIZOEIRA!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #006028;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .actions-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .btn, label.btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            background: #ffffff;
            color: #006028;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-radius: 6px;
            border: 2px solid #006028;
            cursor: pointer;
            text-align: center;
        }

        .btn:disabled {
            background: #cccccc;
            color: #666666;
            border-color: #999999;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none !important;
        }

        .molduras-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .moldura-thumb {
            width: 50px;
            height: 50px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
        }

        .moldura-thumb.active {
            border: 3px solid #2EC254;
            background: rgba(255, 255, 255, 0.8);
        }

        .preview-area {
            position: relative;
            width: 100%;
            max-width: 280px;
            margin-bottom: 15px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            aspect-ratio: 1 / 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-logo {
            max-height: 40px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PERSONALIZAR FOTO</h1>

        <p style="font-size:0.8rem; margin-bottom:8px;">Escolha a moldura:</p>
        <div class="molduras-grid">
            <img src="moldura1.webp" class="moldura-thumb active" onclick="selectMoldura(0, this)" alt="1">
            <img src="moldura2.webp" class="moldura-thumb" onclick="selectMoldura(1, this)" alt="2">
            <img src="moldura3.webp" class="moldura-thumb" onclick="selectMoldura(2, this)" alt="3">
            <img src="moldura4.webp" class="moldura-thumb" onclick="selectMoldura(3, this)" alt="4">
            <img src="moldura5.webp" class="moldura-thumb" onclick="selectMoldura(4, this)" alt="5">
        </div>

        <div class="actions-container">
            <label for="cameraInput" class="btn">📸 TIRAR FOTO</label>
            <input type="file" id="cameraInput" accept="image/*" capture="user">

            <label for="galleryInput" class="btn">📁 CARREGAR FOTO</label>
            <input type="file" id="galleryInput" accept="image/*">
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="actions-container">
            <button id="downloadBtn" class="btn" disabled>💾 BAIXAR FOTO PRONTA</button>
            <a href="index.html" class="btn">⬅️ VOLTAR</a>
        </div>
    </div>

    <footer>
        <img src="LOGOMARCA.webp" alt="Logomarca" class="main-logo">
    </footer>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        const moldurasSrc = [
            'moldura1.webp',
            'moldura2.webp',
            'moldura3.webp',
            'moldura4.webp',
            'moldura5.webp'
        ];

        let selectedMolduraIndex = 0;
        let userImg = null;

        canvas.width = 500;
        canvas.height = 500;

        function selectMoldura(index, element) {
            document.querySelectorAll('.moldura-thumb').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedMolduraIndex = index;

            if (userImg) {
                render();
            }
        }

        function processFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    userImg = img;
                    render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        cameraInput.addEventListener('change', (e) => processFile(e.target.files[0]));
        galleryInput.addEventListener('change', (e) => processFile(e.target.files[0]));

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (userImg) {
                const imgW = userImg.width;
                const imgH = userImg.height;
                const ratio = Math.max(canvas.width / imgW, canvas.height / imgH);
                const cx = (canvas.width - imgW * ratio) / 2;
                const cy = (canvas.height - imgH * ratio) / 2;

                ctx.drawImage(userImg, 0, 0, imgW, imgH, cx, cy, imgW * ratio, imgH * ratio);
            }

            const frame = new Image();
            frame.onload = () => {
                ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                downloadBtn.disabled = false;
            };
            frame.src = moldurasSrc[selectedMolduraIndex];
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-kizoeira.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
