<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Personalizar Foto - #TIMEKIZOEIRA!</title>
    
    <script>
        if (window.location.protocol === 'http:') {
            window.location.href = window.location.href.replace('http:', 'https:');
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #006028;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .actions-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 10px 0;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 10px 5px;
            background: #ffffff;
            color: #006028;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 2px solid #006028;
            cursor: pointer;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-small:disabled {
            background: #cccccc;
            color: #666666;
            border-color: #999999;
            cursor: not-allowed;
        }

        .btn, label.btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            background: #ffffff;
            color: #006028;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            border: 2px solid #006028;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:disabled {
            background: #cccccc;
            color: #666666;
            border-color: #999999;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none !important;
        }

        .molduras-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .moldura-thumb {
            width: 50px;
            height: 50px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
        }

        .moldura-thumb.active {
            border: 3px solid #2EC254;
            background: rgba(255, 255, 255, 0.8);
        }

        .preview-area {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 10px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: move;
        }

        .instructions {
            font-size: 0.75rem;
            margin-bottom: 10px;
            color: #d4ffd9;
        }

        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PERSONALIZAR FOTO</h1>

        <p style="font-size:0.85rem; margin-bottom:8px;">Escolha a moldura:</p>
        <div class="molduras-grid">
            <img src="moldura1.webp" class="moldura-thumb active" onclick="selectMoldura(0, this)" alt="1">
            <img src="moldura2.webp" class="moldura-thumb" onclick="selectMoldura(1, this)" alt="2">
            <img src="moldura3.webp" class="moldura-thumb" onclick="selectMoldura(2, this)" alt="3">
            <img src="moldura4.webp" class="moldura-thumb" onclick="selectMoldura(3, this)" alt="4">
            <img src="moldura5.webp" class="moldura-thumb" onclick="selectMoldura(4, this)" alt="5">
        </div>

        <div class="actions-container">
            <label for="galleryInput" class="btn">📁 CARREGAR FOTO</label>
            <input type="file" id="galleryInput" accept="image/*">
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Ferramentas de Giro e Zoom -->
        <div class="controls-row">
            <button id="rotateBtn" class="btn-small" disabled onclick="rotateImage()">🔄 GIRAR 90°</button>
            <button id="zoomInBtn" class="btn-small" disabled onclick="zoomImage(1.1)">🔍 + ZOOM</button>
            <button id="zoomOutBtn" class="btn-small" disabled onclick="zoomImage(0.9)">🔍 - ZOOM</button>
        </div>
        
        <p class="instructions">💡 Arraste com o dedo para mover a foto ao fundo.</p>

        <div class="actions-container">
            <button id="downloadBtn" class="btn" disabled>💾 BAIXAR FOTO PRONTA</button>
            <a href="index.html" class="btn">⬅️ VOLTAR</a>
        </div>
    </div>

    <footer>
        <p style="font-weight:bold;">#TIMEKIZOEIRA</p>
    </footer>

    <script>
        const galleryInput = document.getElementById('galleryInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const downloadBtn = document.getElementById('downloadBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');

        const moldurasSrc = [
            'moldura1.webp',
            'moldura2.webp',
            'moldura3.webp',
            'moldura4.webp',
            'moldura5.webp'
        ];

        let selectedMolduraIndex = 0;
        let userImg = null;
        let frameImg = new Image();

        canvas.width = 400;
        canvas.height = 400;

        let imgX = 0;
        let imgY = 0;
        let imgScale = 1;
        let rotationAngle = 0; // Ângulo de rotação em graus (0, 90, 180, 270)

        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let renderPending = false;

        frameImg.src = moldurasSrc[0];
        frameImg.onload = () => requestRender();

        function selectMoldura(index, element) {
            document.querySelectorAll('.moldura-thumb').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedMolduraIndex = index;
            frameImg.src = moldurasSrc[index];
            frameImg.onload = () => requestRender();
        }

        function processFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    userImg = img;
                    rotationAngle = 0; // Reseta o giro para novas fotos
                    
                    const baseScale = Math.max(canvas.width / img.width, canvas.height / img.height);
                    imgScale = baseScale;
                    imgX = canvas.width / 2;
                    imgY = canvas.height / 2;

                    requestRender();
                    
                    // Habilita os botões de controle
                    downloadBtn.disabled = false;
                    rotateBtn.disabled = false;
                    zoomInBtn.disabled = false;
                    zoomOutBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        galleryInput.addEventListener('change', (e) => processFile(e.target.files[0]));

        function rotateImage() {
            if (!userImg) return;
            rotationAngle = (rotationAngle + 90) % 360;
            requestRender();
        }

        function zoomImage(factor) {
            if (!userImg) return;
            imgScale *= factor;
            requestRender();
        }

        function requestRender() {
            if (!renderPending) {
                renderPending = true;
                requestAnimationFrame(render);
            }
        }

        function render() {
            renderPending = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Desenha e rotaciona a imagem do usuário
            if (userImg) {
                ctx.save();
                ctx.translate(imgX, imgY);
                ctx.rotate((rotationAngle * Math.PI) / 180);
                ctx.drawImage(
                    userImg,
                    (-userImg.width * imgScale) / 2,
                    (-userImg.height * imgScale) / 2,
                    userImg.width * imgScale,
                    userImg.height * imgScale
                );
                ctx.restore();
            }

            // 2. Desenha a moldura por cima (fixa)
            if (frameImg.complete && frameImg.naturalWidth !== 0) {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
            }
        }

        // --- CONTROLE DE ARRASTAR (MOVE A FOTO) ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function handleStart(e) {
            if (!userImg) return;
            isDragging = true;
            const pos = getPos(e);
            startX = pos.x - imgX;
            startY = pos.y - imgY;
        }

        function handleMove(e) {
            if (!isDragging || !userImg) return;
            const pos = getPos(e);
            imgX = pos.x - startX;
            imgY = pos.y - startY;
            requestRender();
        }

        function handleEnd() {
            isDragging = false;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: true });
        canvas.addEventListener('touchmove', handleMove, { passive: true });
        canvas.addEventListener('touchend', handleEnd);

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-kizoeira.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
