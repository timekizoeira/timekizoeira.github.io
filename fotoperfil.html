<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personalizar Foto - #TIMEKIZOEIRA!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: #006028;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .actions-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 10px 0;
        }

        .btn, label.btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            background: #ffffff;
            color: #006028;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            border: 2px solid #006028;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:disabled {
            background: #cccccc;
            color: #666666;
            border-color: #999999;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none !important;
        }

        .molduras-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .moldura-thumb {
            width: 50px;
            height: 50px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
        }

        .moldura-thumb.active {
            border: 3px solid #2EC254;
            background: rgba(255, 255, 255, 0.8);
        }

        .preview-area {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin-bottom: 15px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            touch-action: none; /* Permite arrastar no celular sem rolar a página */
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: move;
        }

        .instructions {
            font-size: 0.75rem;
            margin-bottom: 10px;
            color: #d4ffd9;
        }

        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PERSONALIZAR FOTO</h1>

        <p style="font-size:0.85rem; margin-bottom:8px;">Escolha a moldura:</p>
        <div class="molduras-grid">
            <img src="moldura1.webp" class="moldura-thumb active" onclick="selectMoldura(0, this)" alt="1">
            <img src="moldura2.webp" class="moldura-thumb" onclick="selectMoldura(1, this)" alt="2">
            <img src="moldura3.webp" class="moldura-thumb" onclick="selectMoldura(2, this)" alt="3">
            <img src="moldura4.webp" class="moldura-thumb" onclick="selectMoldura(3, this)" alt="4">
            <img src="moldura5.webp" class="moldura-thumb" onclick="selectMoldura(4, this)" alt="5">
        </div>

        <div class="actions-container">
            <label for="cameraInput" class="btn">📸 TIRAR FOTO</label>
            <input type="file" id="cameraInput" accept="image/*" capture="user">

            <label for="galleryInput" class="btn">📁 CARREGAR FOTO</label>
            <input type="file" id="galleryInput" accept="image/*">
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
        </div>
        
        <p class="instructions">💡 Arraste com o dedo para mover e use dois dedos para dar zoom na foto.</p>

        <div class="actions-container">
            <button id="downloadBtn" class="btn" disabled>💾 BAIXAR FOTO PRONTA</button>
            <a href="index.html" class="btn">⬅️ VOLTAR</a>
        </div>
    </div>

    <footer>
        <p style="font-weight:bold;">#TIMEKIZOEIRA</p>
    </footer>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        const moldurasSrc = [
            'moldura1.webp',
            'moldura2.webp',
            'moldura3.webp',
            'moldura4.webp',
            'moldura5.webp'
        ];

        let selectedMolduraIndex = 0;
        let userImg = null;
        let frameImg = new Image();

        // Configuração do Canvas Interno
        canvas.width = 600;
        canvas.height = 600;

        // Controle de Transformação da Foto
        let imgX = 0;
        let imgY = 0;
        let imgScale = 1;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let initialPinchDistance = null;

        // Pré-carrega a primeira moldura
        frameImg.src = moldurasSrc[0];
        frameImg.onload = () => render();

        function selectMoldura(index, element) {
            document.querySelectorAll('.moldura-thumb').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedMolduraIndex = index;
            frameImg.src = moldurasSrc[index];
            frameImg.onload = () => render();
        }

        function processFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    userImg = img;
                    
                    // Ajuste inicial proporcional (Cover)
                    const baseScale = Math.max(canvas.width / img.width, canvas.height / img.height);
                    imgScale = baseScale;
                    imgX = (canvas.width - img.width * imgScale) / 2;
                    imgY = (canvas.height - img.height * imgScale) / 2;

                    render();
                    downloadBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        cameraInput.addEventListener('change', (e) => processFile(e.target.files[0]));
        galleryInput.addEventListener('change', (e) => processFile(e.target.files[0]));

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Desenha a Foto do Usuário (Se existir)
            if (userImg) {
                ctx.save();
                ctx.drawImage(userImg, imgX, imgY, userImg.width * imgScale, userImg.height * imgScale);
                ctx.restore();
            }

            // 2. Desenha a Moldura por cima
            if (frameImg.complete && frameImg.naturalWidth !== 0) {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
            }
        }

        // --- CONTROLES DE INTERAÇÃO (TOQUE E MOUSE) ---
        
        function getCanvasPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function getPinchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Eventos Mouse/Touch Start
        const handleStart = (e) => {
            if (!userImg) return;
            if (e.touches && e.touches.length === 2) {
                initialPinchDistance = getPinchDistance(e);
            } else {
                isDragging = true;
                const pt = getCanvasPoint(e);
                startX = pt.x - imgX;
                startY = pt.y - imgY;
            }
        };

        // Eventos Mouse/Touch Move
        const handleMove = (e) => {
            if (!userImg) return;

            if (e.touches && e.touches.length === 2) {
                // Zoom com 2 dedos (Pinch)
                const currentDist = getPinchDistance(e);
                if (initialPinchDistance) {
                    const factor = currentDist / initialPinchDistance;
                    imgScale *= factor;
                    initialPinchDistance = currentDist;
                    render();
                }
            } else if (isDragging) {
                // Mover foto
                const pt = getCanvasPoint(e);
                imgX = pt.x - startX;
                imgY = pt.y - startY;
                render();
            }
        };

        // Eventos Mouse/Touch End
        const handleEnd = () => {
            isDragging = false;
            initialPinchDistance = null;
        };

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: true });
        canvas.addEventListener('touchmove', handleMove, { passive: true });
        canvas.addEventListener('touchend', handleEnd);

        // Zoom com Scroll do Mouse
        canvas.addEventListener('wheel', (e) => {
            if (!userImg) return;
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
            imgScale *= zoomFactor;
            render();
        }, { passive: false });

        // Download da Imagem Final
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-kizoeira.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
