<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizar Foto - #TIMEKIZOEIRA!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', Arial, sans-serif;
        }

        body {
            background-image: url('BG_SITE.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            font-family: Arial, sans-serif;
            font-weight: normal;
            color: #ffffff !important;
            margin-bottom: 25px;
        }

        .actions-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn, a.btn {
            display: block !important;
            width: 100% !important;
            padding: 14px 10px !important;
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #006028 !important;
            text-decoration: none !important;
            font-size: 0.9rem !important;
            font-style: italic !important;
            text-transform: uppercase !important;
            border-radius: 6px !important;
            border: 2px solid #006028 !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) !important;
            transition: all 0.3s ease !important;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover, a.btn:hover {
            transform: translateY(-2px) !important;
            background: #006028 !important;
            background-color: #006028 !important;
            color: #ffffff !important;
            border-color: #006028 !important;
        }

        .btn:disabled {
            background: #cccccc !important;
            color: #666666 !important;
            border-color: #999999 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        input[type="file"] {
            display: none;
        }

        .preview-area {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }

        video, canvas {
            width: 100%;
            height: auto;
            border: 3px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            background: rgba(0,0,0,0.2);
        }

        video {
            display: none;
        }

        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .main-logo {
            max-height: 55px;
            max-width: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PERSONALIZAR FOTO</h1>
        <p class="subtitle">Tire uma foto ou escolha uma da sua galeria:</p>

        <div class="actions-container">
            <!-- Botão inteligente para tirar foto -->
            <button class="btn" id="takePhotoBtn">📸 TIRAR FOTO</button>
            <input type="file" id="mobileCameraInput" accept="image/*" capture="user">

            <!-- Botão de capturar webcam (visível só no PC quando a câmera tá aberta) -->
            <button class="btn" id="captureWebcamBtn" style="display: none;">📷 CAPTURAR FOTO</button>

            <!-- Botão para escolher da galeria/pastas -->
            <button class="btn" onclick="document.getElementById('galleryInput').click();">📁 CARREGAR FOTO</button>
            <input type="file" id="galleryInput" accept="image/*">
        </div>

        <div class="preview-area">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="actions-container">
            <button id="downloadBtn" class="btn" disabled>💾 BAIXAR FOTO PRONTA</button>
            <a href="index.html" class="btn">⬅️ VOLTAR</a>
        </div>
    </div>

    <footer>
        <img src="LOGOMARCA.webp" alt="Logomarca Principal" class="main-logo">
    </footer>

    <script>
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const mobileCameraInput = document.getElementById('mobileCameraInput');
        const captureWebcamBtn = document.getElementById('captureWebcamBtn');
        const galleryInput = document.getElementById('galleryInput');
        const webcam = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        const moldura = new Image();
        moldura.src = 'moldura.png';

        let userImg = null;
        let streamTrack = null;

        // Detecta se é celular/tablet ou computador
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        takePhotoBtn.addEventListener('click', async () => {
            if (isMobile) {
                // No celular: abre o aplicativo de câmera direto
                mobileCameraInput.click();
            } else {
                // No notebook/computador: abre a webcam ao vivo
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 1080 }, height: { ideal: 1080 } } 
                    });
                    webcam.srcObject = stream;
                    webcam.style.display = 'block';
                    canvas.style.display = 'none';
                    
                    streamTrack = stream.getTracks()[0];
                    
                    takePhotoBtn.style.display = 'none';
                    captureWebcamBtn.style.display = 'block';
                } catch (err) {
                    // Caso o computador não tenha webcam, abre a janela de arquivos
                    mobileCameraInput.click();
                }
            }
        });

        // Captura foto da webcam (Notebook)
        captureWebcamBtn.addEventListener('click', () => {
            userImg = webcam;
            render();
            
            if (streamTrack) streamTrack.stop();
            webcam.style.display = 'none';
            canvas.style.display = 'block';

            captureWebcamBtn.style.display = 'none';
            takePhotoBtn.style.display = 'block';
        });

        // Processa imagem tirada no celular ou escolhida da galeria
        function processFile(file) {
            if (!file) return;

            if (streamTrack) streamTrack.stop();
            webcam.style.display = 'none';
            canvas.style.display = 'block';

            const reader = new FileReader();
            reader.onload = (event) => {
                userImg = new Image();
                userImg.onload = render;
                userImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        mobileCameraInput.addEventListener('change', (e) => processFile(e.target.files[0]));
        galleryInput.addEventListener('change', (e) => processFile(e.target.files[0]));

        function render() {
            canvas.width = moldura.width || 1080;
            canvas.height = moldura.height || 1080;

            if (userImg) {
                const imgWidth = userImg.videoWidth || userImg.width;
                const imgHeight = userImg.videoHeight || userImg.height;

                const hRatio = canvas.width / imgWidth;
                const vRatio = canvas.height / imgHeight;
                const ratio = Math.max(hRatio, vRatio);
                const centerShift_x = (canvas.width - imgWidth * ratio) / 2;
                const centerShift_y = (canvas.height - imgHeight * ratio) / 2;

                ctx.drawImage(userImg, 0, 0, imgWidth, imgHeight,
                    centerShift_x, centerShift_y, imgWidth * ratio, imgHeight * ratio);
            }

            ctx.drawImage(moldura, 0, 0, canvas.width, canvas.height);
            downloadBtn.disabled = false;
        }

        moldura.onload = () => {
            canvas.width = moldura.width || 1080;
            canvas.height = moldura.height || 1080;
            ctx.drawImage(moldura, 0, 0, canvas.width, canvas.height);
        };

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-moldura-kizoeira.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
