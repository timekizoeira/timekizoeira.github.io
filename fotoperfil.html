<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizar Foto - #TIMEKIZOEIRA!</title>
    
    <!-- Console de Diagnóstico no Celular -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #006028;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .actions-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .btn, label.btn {
            display: block;
            width: 100%;
            padding: 14px 10px;
            background: #ffffff;
            color: #006028;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            border: 2px solid #006028;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn:disabled {
            background: #cccccc;
            color: #666666;
            border-color: #999999;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none !important;
        }

        .preview-area {
            width: 100%;
            max-width: 280px;
            margin-bottom: 15px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            aspect-ratio: 1 / 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PERSONALIZAR FOTO</h1>

        <div class="actions-container">
            <label for="cameraInput" class="btn">📸 TIRAR FOTO</label>
            <input type="file" id="cameraInput" accept="image/*" capture="user">

            <label for="galleryInput" class="btn">📁 CARREGAR FOTO</label>
            <input type="file" id="galleryInput" accept="image/*">
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="actions-container">
            <button id="downloadBtn" class="btn" disabled>💾 BAIXAR FOTO PRONTA</button>
            <a href="index.html" class="btn">⬅️ VOLTAR</a>
        </div>
    </div>

    <footer>
        <p>#TIMEKIZOEIRA</p>
    </footer>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        canvas.width = 400;
        canvas.height = 400;

        function processFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    downloadBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        cameraInput.addEventListener('change', (e) => processFile(e.target.files[0]));
        galleryInput.addEventListener('change', (e) => processFile(e.target.files[0]));

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-kizoeira.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
