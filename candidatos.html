<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Candidatos - #TIMEKIZOEIRA</title>

    <!-- Fonte Google: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #004d20;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            opacity: 0;
            /* Duração aumentada para 1.0s para uma entrada mais suave */
            animation: fadeInContainer 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInContainer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Barra superior para voltar */
        .back-bar {
            background-color: #006028;
            padding: 12px 15px;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .back-link:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        /* ESTRUTURA BASE DOS CARDS COM ANIMAÇÃO MAIS LENTA E FLUIDA */
        .card {
            position: relative;
            width: 100%;
            min-height: 250px;
            display: flex;
            overflow: hidden;
            padding: 20px 18px;
            border-bottom: 2px solid #000000;
            opacity: 0;
            transform: translateY(30px);
            /* Duração aumentada para 0.8s */
            animation: slideUpCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: background-color 0.4s ease;
        }

        /* Delays em cascata mais espaçados (0.2s, 0.4s, 0.6s) */
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.4s; }
        .card:nth-child(4) { animation-delay: 0.6s; }

        @keyframes slideUpCard {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 1. CARD ORLEANS BRANDÃO (VERDE) */
        .card-orleans {
            background-color: #009944;
            min-height: 270px;
            align-items: flex-start;
            justify-content: flex-end;
        }

        .card-orleans .candidate-img {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 100%;
            width: auto;
            object-fit: contain;
            z-index: 1;
            /* Transição de imagem mais suave (0.7s) */
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-orleans:hover .candidate-img {
            transform: scale(1.03);
        }

        .card-orleans .info-box {
            position: relative;
            z-index: 2;
            width: 55%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-top: 5px;
        }

        .logo-orleans {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* 2. CARD AMANDA GENTIL (ROXO) */
        .card-amanda {
            background-color: #611b8d;
            min-height: 260px;
            align-items: center;
        }

        .card-amanda .info-box {
            position: relative;
            z-index: 2;
            width: 55%;
            text-align: left;
            padding-left: 5px;
        }

        .card-amanda .candidate-img {
            position: absolute;
            right: 0;
            bottom: 0;
            height: 100%;
            width: auto;
            object-fit: contain;
            z-index: 1;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-amanda:hover .candidate-img {
            transform: scale(1.03);
        }

        /* 3. CARD GLEYDSON RESENDE (VERDE) */
        .card-gleydson {
            background-color: #009944;
            min-height: 270px;
            align-items: center;
            border-bottom: none;
        }

        .card-gleydson .candidate-img {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 100%;
            width: auto;
            object-fit: contain;
            z-index: 1;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-gleydson:hover .candidate-img {
            transform: scale(1.03);
        }

        .card-gleydson .info-box {
            position: relative;
            z-index: 2;
            margin-left: auto;
            width: 58%;
            text-align: left;
        }

        /* ESTILOS DE TEXTO E TIPOGRAFIA POPPINS */
        .cargo {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 2px;
            opacity: 0.95;
        }

        .nome {
            font-size: 1.65rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .numero {
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
        }

        /* LEGENDA PEQUENA ACIMA DO BOTÃO */
        .insta-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            display: block;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }

        /* BOTÃO INSTAGRAM COM INTERATIVIDADE */
        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            transition: background 0.3s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .insta-btn:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .insta-btn:active {
            transform: scale(0.95) translateY(0);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .verified-badge {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        /* SKELETON SCREEN / FEEDBACK VISUAL STATE DE EXEMPLO */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.08) 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 2.0s infinite;
            color: transparent !important;
            border-radius: 4px;
            user-select: none;
        }

        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* RODAPÉ */
        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 15px;
            text-align: center;
        }

        footer p {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botão Voltar -->
        <div class="back-bar">
            <a href="index.html" class="back-link">← Voltar para o início</a>
        </div>

        <!-- 1. GOVERNADOR ORLEANS BRANDÃO -->
        <div class="card card-orleans">
            <img src="orleans.png" alt="Orleans Brandão" class="candidate-img">
            <div class="info-box">
                <img src="logo-orleans.png" alt="Orleans Brandão 15 - Vice Edivaldo Holanda Jr." class="logo-orleans">
                
                <!-- INSTAGRAM ORLEANS BRANDÃO -->
                <span class="insta-label" style="margin-top: 10px;">Seguir no Instagram</span>
                <a href="https://www.instagram.com/orleansbrandaoma/" target="_blank" class="insta-btn">
                    orleansbrandaoma
                    <svg class="verified-badge" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#0095F6"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- 2. DEPUTADA FEDERAL AMANDA GENTIL -->
        <div class="card card-amanda">
            <div class="info-box">
                <span class="cargo">Deputada Federal</span>
                <h2 class="nome">Amanda Gentil</h2>
                <div class="numero">11 11</div>
                
                <!-- INSTAGRAM AMANDA GENTIL -->
                <span class="insta-label" style="margin-top: 8px;">Seguir no Instagram</span>
                <a href="https://www.instagram.com/amandagentill/" target="_blank" class="insta-btn">
                    amandagentill
                    <svg class="verified-badge" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#0095F6"/>
                    </svg>
                </a>
            </div>
            <img src="amanda.png" alt="Amanda Gentil" class="candidate-img">
        </div>

        <!-- 3. DEPUTADO ESTADUAL GLEYDSON RESENDE -->
        <div class="card card-gleydson">
            <img src="gleydson.png" alt="Gleydson Resende" class="candidate-img">
            <div class="info-box">
                <!-- INSTAGRAM GLEYDSON RESENDE -->
                <span class="insta-label">Seguir no Instagram</span>
                <a href="https://www.instagram.com/gleydsonresende/" target="_blank" class="insta-btn" style="margin-bottom: 8px;">
                    gleydsonresende
                    <svg class="verified-badge" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#0095F6"/>
                    </svg>
                </a>

                <span class="cargo">Deputado Estadual</span>
                <h2 class="nome">Gleydson Resende</h2>
                <div class="numero">15700</div>
            </div>
        </div>

        <!-- RODAPÉ -->
        <footer>
            <p>#TIMEKIZOEIRA</p>
        </footer>
    </div>

</body>
</html>
