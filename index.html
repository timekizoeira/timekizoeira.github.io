<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links de Campanha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', Arial, sans-serif;
        }

        body {
            background-image: url('BG_SITE.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Foto de Perfil / Emoji PNG */
        .profile-pic {
            width: 180px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
        }

        /* Títulos */
        h1 {
            font-size: 1.6rem;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.85rem;
            font-family: Arial, sans-serif;
            font-weight: normal;
            color: #ffffff !important;
            margin-bottom: 25px;
        }

        /* Container da Lista de Botões */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ESTILO DOS BOTÕES (Sobrescreve qualquer regra azul antiga) */
        .btn, .btn-link, a.btn, a.btn-link, .links-container a {
            display: block !important;
            width: 100% !important;
            padding: 14px 10px !important;
            background: #ffffff !important;
            background-color: #ffffff !important;
            background-image: none !important;
            color: #006028 !important;
            text-decoration: none !important;
            font-size: 0.9rem !important;
            font-style: italic !important;
            text-transform: uppercase !important;
            border-radius: 6px !important;
            border: 2px solid #006028 !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) !important;
            transition: all 0.3s ease !important;
        }

        /* EFITO HOVER (Passar o mouse sobre os botões) */
        .btn:hover, .btn-link:hover, a.btn:hover, a.btn-link:hover, .links-container a:hover {
            transform: translateY(-2px) !important;
            background: #006028 !important;
            background-color: #006028 !important;
            background-image: none !important;
            color: #ffffff !important;
            border-color: #006028 !important;
        }

        /* Rodapé com Logomarcas */
        footer {
            width: 100%;
            background-color: #2EC254;
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .main-logo {
            max-height: 55px;
            max-width: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- FOTO DE PERFIL / EMOJI PNG -->
        <img src="EMOJI MAR.png" alt="Emoji Mar" class="profile-pic">

        <h1>#TIME<span>KIZOEIRA!</span></h1>
        <p class="subtitle">Baixe os materiais e participe da nossa campanha!</p>

        <!-- LISTA DE BOTÕES -->
        <div class="links-container">
            <a href="./fotoperfil.html" class="btn-link">PERSONALIZE SUA FOTO DO PERFIL</a>
            <a href="https://drive.google.com/drive/folders/1wy7o5esKOH-3LmO0V4_sNF3JuceUP9IB?usp=drive_link" class="btn" target="_blank">📦 MATERIAIS DE CAMPANHA</a>
            <a href="#" class="btn-link" target="_blank">CARDS DE APOIO</a>
            <a href="#" class="btn-link" target="_blank">FOTOS E VÍDEOS</a>
            <a href="#" class="btn-link" target="_blank">MÚSICAS DA CAMPANHA</a>
            <a href="#" class="btn-link" target="_blank">FUNDO DE TELA PARA CELULAR</a>
            <a href="https://www.instagram.com/marciodokizoeira/" class="btn-link" target="_blank">INSTAGRAM</a>
            <a href="https://wa.me/559881318522" class="btn-link" target="_blank">WHATSAPP</a>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer>
        <img src="LOGOMARCA.webp" alt="Logomarca Principal" class="main-logo">
    </footer>

</body>
</html>
